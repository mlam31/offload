[package]
name = "offload"
version = "0.1.0"
edition = "2021"
description = "Offload Sony A6700 media from SD card to disk, sorted by capture date, with content-based dedup"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
walkdir = "2"
kamadak-exif = "0.6"
jiff = "0.2"
ratatui = "0.29"
crossterm = "0.28"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
anyhow = "1"
libc = "0.2"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
